name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · lint · typecheck · test · contract · build · security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc -b + web)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (real PostgreSQL 18, embedded)
        run: npm run test:integration

      - name: OpenAPI contract (regenerate + drift check)
        run: npm run openapi:check

      - name: Build
        run: npm run build

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Financial-float grep gate (spec §22.1 — no float money)
        run: |
          if git grep -nE 'parseFloat|Number\(.*[Yy]uan|toFixed\(' -- 'packages/*/src/*.ts' 'apps/api/src/*.ts' ':!*.test.ts'; then
            echo "::error::possible float money handling found — review ADR-0002"
            exit 1
          fi
